<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jugando con Chucho</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Patrick Hand', cursive;
      background-color: #F5E6C8;
      color: #8B4513;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      font-size: 28px;
      text-transform: lowercase;
    }

    /* Screen management */
    .screen {
      display: none;
      width: 100%;
      max-width: 900px;
      flex-direction: column;
      align-items: center;
    }

    .screen.active {
      display: flex;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 10px 20px;
      margin-bottom: 20px;
    }

    .title {
      font-size: 32px;
      color: #2E5090;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title .paw {
      font-size: 24px;
    }

    /* Progress dots */
    .progress {
      display: flex;
      gap: 8px;
    }

    .progress-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: #FFE4B5;
      border: 2px solid #8B4513;
      transition: background-color 0.3s ease;
    }

    .progress-dot.completed {
      background-color: #4CAF50;
    }

    .progress-dot.current {
      background-color: #D2691E;
      animation: pulse-dot 1s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    /* Game container */
    .game-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
      width: 100%;
      padding: 20px;
    }

    /* Rhyme container */
    .rhyme-container {
      flex: 1;
      min-width: 300px;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 30px;
      line-height: 1.8;
      font-size: 30px;
    }

    .rhyme-line {
      margin: 8px 0;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
    }

    /* Colorful letter classes */
    .letter-red { color: #E53935; }
    .letter-blue { color: #1E88E5; }
    .letter-green { color: #43A047; }
    .letter-orange { color: #FB8C00; }
    .letter-purple { color: #8E24AA; }
    .letter-brown { color: #8B4513; }

    /* Blank word styling */
    .blank {
      display: inline-block;
      min-width: 80px;
      padding: 2px 10px;
      border-bottom: 4px dashed #2E5090;
      margin: 0 5px;
      text-align: center;
      animation: pulse-blank 1.5s ease-in-out infinite;
      background: rgba(255,255,255,0.3);
      border-radius: 5px 5px 0 0;
    }

    .blank .letter-red,
    .blank .letter-blue,
    .blank .letter-green,
    .blank .letter-orange,
    .blank .letter-purple,
    .blank .letter-brown {
      color: transparent;
    }

    .blank.filled {
      border-bottom: 4px solid #4CAF50;
      animation: none;
      background: rgba(76, 175, 80, 0.15);
    }

    .blank.filled .letter-red,
    .blank.filled .letter-blue,
    .blank.filled .letter-green,
    .blank.filled .letter-orange,
    .blank.filled .letter-purple,
    .blank.filled .letter-brown {
      color: #4CAF50;
    }

    @keyframes pulse-blank {
      0%, 100% { border-color: #2E5090; }
      50% { border-color: #D2691E; }
    }

    /* Chucho container */
    .chucho-container {
      width: 200px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Chucho SVG animations */
    .chucho-svg {
      width: 180px;
      height: 220px;
    }

    .chucho-svg.idle .tail {
      animation: wag-tail 0.5s ease-in-out infinite;
      transform-origin: 85% 75%;
    }

    .chucho-svg.waiting .head {
      animation: tilt-head 2s ease-in-out infinite;
      transform-origin: center;
    }

    .chucho-svg.correct {
      animation: jump 0.5s ease-in-out;
    }

    .chucho-svg.correct .tail {
      animation: wag-tail 0.2s ease-in-out infinite;
      transform-origin: 85% 75%;
    }

    .chucho-svg.wrong .head {
      animation: encourage 0.5s ease-in-out;
      transform-origin: center;
    }

    .chucho-svg.complete {
      animation: celebrate 0.5s ease-in-out infinite;
    }

    .chucho-svg.complete .tail {
      animation: wag-tail 0.15s ease-in-out infinite;
      transform-origin: 85% 75%;
    }

    @keyframes wag-tail {
      0%, 100% { transform: rotate(-15deg); }
      50% { transform: rotate(15deg); }
    }

    @keyframes tilt-head {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-10deg); }
      75% { transform: rotate(10deg); }
    }

    @keyframes jump {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-30px); }
    }

    @keyframes encourage {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    @keyframes celebrate {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-15px) rotate(3deg); }
    }

    /* Answer buttons container */
    .answers-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      width: 100%;
      padding: 30px;
      margin-top: 20px;
    }

    /* Answer buttons */
    .answer-btn {
      font-family: 'Patrick Hand', cursive;
      font-size: 32px;
      padding: 20px 40px;
      min-width: 150px;
      min-height: 70px;
      background-color: #FFE4B5;
      border: 4px solid #8B4513;
      border-radius: 15px;
      color: #8B4513;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: lowercase;
    }

    .answer-btn:hover:not(:disabled) {
      transform: scale(1.05);
      background-color: #FFD699;
    }

    .answer-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .answer-btn.correct {
      background-color: #4CAF50;
      border-color: #388E3C;
      animation: success-pop 0.3s ease-out;
    }

    .answer-btn.correct .letter-red,
    .answer-btn.correct .letter-blue,
    .answer-btn.correct .letter-green,
    .answer-btn.correct .letter-orange,
    .answer-btn.correct .letter-purple,
    .answer-btn.correct .letter-brown {
      color: white;
    }

    .answer-btn.wrong {
      background-color: #E57373;
      border-color: #D32F2F;
      animation: shake 0.5s ease-in-out;
    }

    .answer-btn.wrong .letter-red,
    .answer-btn.wrong .letter-blue,
    .answer-btn.wrong .letter-green,
    .answer-btn.wrong .letter-orange,
    .answer-btn.wrong .letter-purple,
    .answer-btn.wrong .letter-brown {
      color: white;
    }

    .answer-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @keyframes success-pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-10px); }
      80% { transform: translateX(10px); }
    }

    /* Stars animation */
    .stars-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    .star {
      position: absolute;
      font-size: 40px;
      animation: star-fly 1s ease-out forwards;
    }

    @keyframes star-fly {
      0% {
        opacity: 1;
        transform: translateY(0) scale(0);
      }
      50% {
        opacity: 1;
        transform: translateY(-50px) scale(1.2);
      }
      100% {
        opacity: 0;
        transform: translateY(-100px) scale(0.5);
      }
    }

    /* Title screen */
    .title-screen {
      text-align: center;
      padding-top: 50px;
    }

    .main-title {
      font-size: 56px;
      color: #2E5090;
      margin-bottom: 30px;
      text-shadow: 3px 3px 0 #D2691E;
    }

    .title-chucho {
      margin: 40px 0;
    }

    .play-btn {
      font-family: 'Patrick Hand', cursive;
      font-size: 40px;
      padding: 20px 60px;
      background-color: #4CAF50;
      border: 4px solid #388E3C;
      border-radius: 20px;
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 10px;
      text-transform: lowercase;
    }

    .play-btn:hover {
      transform: scale(1.05);
      background-color: #45a049;
    }

    .play-btn.secondary {
      background-color: #FFE4B5;
      border-color: #8B4513;
      color: #8B4513;
      font-size: 32px;
      padding: 15px 40px;
    }

    .play-btn.secondary:hover {
      background-color: #FFD699;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    /* Complete screen */
    .complete-screen {
      text-align: center;
      padding-top: 30px;
    }

    .congrats-title {
      font-size: 48px;
      color: #4CAF50;
      margin-bottom: 20px;
    }

    .complete-rhyme {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 30px;
      margin: 30px 0;
      line-height: 1.8;
      font-size: 28px;
      max-width: 500px;
    }

    .complete-chucho {
      margin: 30px 0;
    }

    /* Confetti */
    .confetti-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
      overflow: hidden;
    }

    .confetti {
      position: absolute;
      width: 15px;
      height: 15px;
      top: -20px;
      animation: confetti-fall 3s ease-in-out forwards;
    }

    @keyframes confetti-fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* Review mode styling */
    .review-blank {
      display: inline-block;
      min-width: 70px;
      padding: 2px 8px;
      border-bottom: 3px dashed #2E5090;
      margin: 0 3px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(255,255,255,0.3);
      border-radius: 5px 5px 0 0;
    }

    .review-blank .letter-red,
    .review-blank .letter-blue,
    .review-blank .letter-green,
    .review-blank .letter-orange,
    .review-blank .letter-purple,
    .review-blank .letter-brown {
      color: transparent;
    }

    .review-blank.active {
      border-color: #D2691E;
      animation: pulse-blank 1.5s ease-in-out infinite;
    }

    .review-blank.filled {
      border-bottom: 3px solid #4CAF50;
      cursor: default;
      animation: none;
      background: rgba(76, 175, 80, 0.15);
    }

    .review-blank.filled .letter-red,
    .review-blank.filled .letter-blue,
    .review-blank.filled .letter-green,
    .review-blank.filled .letter-orange,
    .review-blank.filled .letter-purple,
    .review-blank.filled .letter-brown {
      color: #4CAF50;
    }

    /* Responsive */
    @media (max-width: 768px) {
      body {
        font-size: 24px;
        padding: 10px;
      }

      .main-title {
        font-size: 40px;
      }

      .rhyme-container {
        font-size: 26px;
        padding: 20px;
      }

      .answer-btn {
        font-size: 28px;
        padding: 15px 30px;
        min-width: 120px;
      }

      .chucho-container {
        width: 150px;
        height: 200px;
      }

      .chucho-svg {
        width: 140px;
        height: 180px;
      }

      .header {
        flex-direction: column;
        gap: 15px;
      }

      .progress-dot {
        width: 14px;
        height: 14px;
      }
    }
  </style>
</head>

          <!-- Mouth - big smile -->
          <path d="M 80 110 Q 100 130 120 110" stroke="#4A3728" stroke-width="3" fill="none"/>
          <ellipse cx="100" cy="120" rx="12" ry="8" fill="#E57373"/>
        </g>
        <!-- Collar -->
        <rect x="70" y="125" width="60" height="12" rx="3" fill="#CC3333"/>
        <circle cx="100" cy="137" r="6" fill="#FFD700"/>
      </svg>
    </div>
    <div class="complete-rhyme" id="complete-rhyme">
      <!-- Full rhyme shown here -->
    </div>
    <button class="play-btn" id="replay-btn">jugar de nuevo</button>
  </div>

  <script>
    // Game configuration
    const RHYME_LINES = [
      { text: 'morito va de', word: 'caza' },
      { text: 'sale un', word: 'conejo' },
      { text: 'dispara y' },
      { text: 'se hace', word: 'daño' },
      { text: 'en el', word: 'dedo' },
      { text: '¡ay mi', word: 'dedito', suffix: '!' },
      { text: '¡ay mi dedito! d d d' },
      { text: 'decía el', word: 'gato' },
      { text: 'su', word: 'mamá', suffix: ' se lo curó' },
      { text: 'y dejó de', word: 'llorar' }
    ];

    const LEVELS = [
      { lineIndex: 0, word: 'caza', options: ['caza', 'casa', 'cara'] },
      { lineIndex: 1, word: 'conejo', options: ['conejo', 'gato', 'perro'] },
      { lineIndex: 3, word: 'daño', options: ['daño', 'baño', 'año'] },
      { lineIndex: 4, word: 'dedo', options: ['dedo', 'diente', 'pelo'] },
      { lineIndex: 5, word: 'dedito', options: ['dedito', 'perrito', 'gatito'] },
      { lineIndex: 7, word: 'gato', options: ['gato', 'pato', 'rato'] },
      { lineIndex: 8, word: 'mamá', options: ['mamá', 'papá', 'abuela'] },
      { lineIndex: 8, word: 'curó', wordInSuffix: true, options: ['curó', 'cuidó', 'miró'] },
      { lineIndex: 9, word: 'llorar', options: ['llorar', 'jugar', 'cantar'] },
      { type: 'review' }
    ];

    // Letter colors for colorful text
    const LETTER_COLORS = ['letter-red', 'letter-blue', 'letter-green', 'letter-orange', 'letter-purple', 'letter-brown'];

    // Colorize text with alternating colors
    function colorizeText(text) {
      let colorIndex = 0;
      return text.split('').map(char => {
        if (char === ' ' || char === '!' || char === '¡' || char === '¿' || char === '?') {
          return char;
        }
        const colorClass = LETTER_COLORS[colorIndex % LETTER_COLORS.length];
        colorIndex++;
        return `<span class="${colorClass}">${char}</span>`;
      }).join('');
    }

    // Colorize a word (for blanks)
    function colorizeWord(word) {
      return word.split('').map((char, i) => {
        const colorClass = LETTER_COLORS[i % LETTER_COLORS.length];
        return `<span class="${colorClass}">${char}</span>`;
      }).join('');
    }

    // State
    let gameState = {
      currentLevel: 1,
      completedLevels: [],
      reviewBlanks: [],
      reviewAnswered: 0
    };

    // DOM elements
    const titleScreen = document.getElementById('title-screen');
    const gameScreen = document.getElementById('game-screen');
    const completeScreen = document.getElementById('complete-screen');
    const titleButtons = document.getElementById('title-buttons');
    const playBtn = document.getElementById('play-btn');
    const progress = document.getElementById('progress');
    const rhymeContainer = document.getElementById('rhyme-container');
    const answersContainer = document.getElementById('answers-container');
    const gameChucho = document.getElementById('game-chucho');
    const completeRhyme = document.getElementById('complete-rhyme');
    const replayBtn = document.getElementById('replay-btn');
    const starsContainer = document.getElementById('stars-container');
    const confettiContainer = document.getElementById('confetti-container');

    // Initialize
    function init() {
      loadState();
      setupTitleScreen();
      setupEventListeners();
    }

    // Load state from localStorage
    function loadState() {
      const saved = localStorage.getItem('jugandoConChucho');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          gameState = { ...gameState, ...parsed };
        } catch (e) {
          console.error('Error loading state:', e);
        }
      }
    }

    // Save state to localStorage
    function saveState() {
      localStorage.setItem('jugandoConChucho', JSON.stringify({
        currentLevel: gameState.currentLevel,
        completedLevels: gameState.completedLevels
      }));
    }

    // Setup title screen
    function setupTitleScreen() {
      titleButtons.innerHTML = '';

      if (gameState.currentLevel > 1 && gameState.currentLevel <= 10) {
        // Returning player
        const continueBtn = document.createElement('button');
        continueBtn.className = 'play-btn';
        continueBtn.textContent = 'continuar';
        continueBtn.onclick = () => startGame(false);

        const restartBtn = document.createElement('button');
        restartBtn.className = 'play-btn secondary';
        restartBtn.textContent = 'empezar de nuevo';
        restartBtn.onclick = () => startGame(true);

        titleButtons.appendChild(continueBtn);
        titleButtons.appendChild(restartBtn);
      } else {
        const playBtn = document.createElement('button');
        playBtn.className = 'play-btn';
        playBtn.textContent = '¡jugar!';
        playBtn.onclick = () => startGame(true);
        titleButtons.appendChild(playBtn);
      }
    }

    // Setup event listeners
    function setupEventListeners() {
      replayBtn.onclick = () => {
        resetGame();
        showScreen('title');
      };
    }

    // Show screen
    function showScreen(screenName) {
      titleScreen.classList.remove('active');
      gameScreen.classList.remove('active');
      completeScreen.classList.remove('active');

      switch (screenName) {
        case 'title':
          titleScreen.classList.add('active');
          break;
        case 'game':
          gameScreen.classList.add('active');
          break;
        case 'complete':
          completeScreen.classList.add('active');
          showConfetti();
          break;
      }
    }

    // Start game
    function startGame(reset = false) {
      if (reset) {
        resetGame();
      }
      showScreen('game');
      renderLevel();
    }

    // Reset game
    function resetGame() {
      gameState = {
        currentLevel: 1,
        completedLevels: [],
        reviewBlanks: [],
        reviewAnswered: 0
      };
      saveState();
      setupTitleScreen();
    }

    // Render progress dots
    function renderProgress() {
      progress.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        const dot = document.createElement('div');
        dot.className = 'progress-dot';
        if (gameState.completedLevels.includes(i)) {
          dot.classList.add('completed');
        } else if (i === gameState.currentLevel) {
          dot.classList.add('current');
        }
        progress.appendChild(dot);
      }
    }

    // Render level
    function renderLevel() {
      renderProgress();
      const level = LEVELS[gameState.currentLevel - 1];

      if (level.type === 'review') {
        renderReviewLevel();
      } else {
        renderNormalLevel(level);
      }

      setChucho('waiting');
    }

    // Render normal level
    function renderNormalLevel(level) {
      rhymeContainer.innerHTML = '';

      RHYME_LINES.forEach((line, index) => {
        const lineDiv = document.createElement('div');
        lineDiv.className = 'rhyme-line';

        if (index === level.lineIndex) {
          if (level.wordInSuffix) {
            // Word is in suffix (like "curó" in "su mamá se lo curó")
            const suffixWithBlank = line.suffix.replace(level.word, `<span class="blank" id="blank">${colorizeWord(level.word)}</span>`);
            lineDiv.innerHTML = colorizeText(line.text) + ' ' + colorizeWord(line.word) + suffixWithBlank.replace(/ se lo /g, colorizeText(' se lo '));
          } else {
            // Normal case
            lineDiv.innerHTML = colorizeText(line.text) + ' <span class="blank" id="blank">' + colorizeWord(line.word) + '</span>' + colorizeText(line.suffix || '');
          }
        } else {
          // Show completed words or full lines
          if (line.word) {
            lineDiv.innerHTML = colorizeText(line.text) + ' ' + colorizeWord(line.word) + colorizeText(line.suffix || '');
          } else {
            lineDiv.innerHTML = colorizeText(line.text);
          }
        }

        rhymeContainer.appendChild(lineDiv);
      });

      // Render answer buttons
      renderAnswerButtons(level.options, level.word);
    }

    // Render review level (level 10)
    function renderReviewLevel() {
      // Select 3 random blanks if not already set
      if (gameState.reviewBlanks.length === 0) {
        const availableWords = LEVELS.slice(0, 9).map((l, i) => ({ ...l, levelIndex: i }));
        const shuffled = availableWords.sort(() => Math.random() - 0.5);
        gameState.reviewBlanks = shuffled.slice(0, 3);
        gameState.reviewAnswered = 0;
      }

      rhymeContainer.innerHTML = '';

      RHYME_LINES.forEach((line, index) => {
        const lineDiv = document.createElement('div');
        lineDiv.className = 'rhyme-line';

        // Check if this line has a review blank
        const reviewBlank = gameState.reviewBlanks.find(rb => rb.lineIndex === index);

        if (reviewBlank) {
          const isAnswered = reviewBlank.answered;
          const isActive = !isAnswered &&
            gameState.reviewBlanks.filter(rb => rb.answered).length ===
            gameState.reviewBlanks.indexOf(reviewBlank);

          if (reviewBlank.wordInSuffix) {
            const blankClass = `review-blank ${isAnswered ? 'filled' : ''} ${isActive ? 'active' : ''}`;
            const suffixWithBlank = line.suffix.replace(reviewBlank.word,
              `<span class="${blankClass}" data-word="${reviewBlank.word}">${colorizeWord(reviewBlank.word)}</span>`);
            lineDiv.innerHTML = colorizeText(line.text) + ' ' + colorizeWord(line.word) + suffixWithBlank.replace(/ se lo /g, colorizeText(' se lo '));
          } else {
            const blankClass = `review-blank ${isAnswered ? 'filled' : ''} ${isActive ? 'active' : ''}`;
            lineDiv.innerHTML = colorizeText(line.text) + ` <span class="${blankClass}" data-word="${reviewBlank.word}">${colorizeWord(reviewBlank.word)}</span>` + colorizeText(line.suffix || '');
          }
        } else if (line.word) {
          lineDiv.innerHTML = colorizeText(line.text) + ' ' + colorizeWord(line.word) + colorizeText(line.suffix || '');
        } else {
          lineDiv.innerHTML = colorizeText(line.text);
        }

        rhymeContainer.appendChild(lineDiv);
      });

      // Find current active blank
      const answeredCount = gameState.reviewBlanks.filter(rb => rb.answered).length;
      if (answeredCount < 3) {
        const currentBlank = gameState.reviewBlanks[answeredCount];
        renderAnswerButtons(currentBlank.options, currentBlank.word, true);
      }
    }

    // Render answer buttons
    function renderAnswerButtons(options, correctWord, isReview = false) {
      answersContainer.innerHTML = '';

      // Shuffle options
      const shuffled = [...options].sort(() => Math.random() - 0.5);

      shuffled.forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.innerHTML = colorizeWord(option);
        btn.dataset.word = option;
        btn.onclick = () => handleAnswer(option, correctWord, isReview);
        answersContainer.appendChild(btn);
      });
    }

    // Handle answer
    function handleAnswer(selected, correct, isReview = false) {
      const buttons = answersContainer.querySelectorAll('.answer-btn');
      const clickedBtn = Array.from(buttons).find(btn => btn.dataset.word === selected);

      if (selected === correct) {
        // Correct answer
        clickedBtn.classList.add('correct');
        buttons.forEach(btn => btn.disabled = true);

        if (isReview) {
          // Mark this review blank as answered
          const answeredCount = gameState.reviewBlanks.filter(rb => rb.answered).length;
          gameState.reviewBlanks[answeredCount].answered = true;

          // Update the blank display
          const blank = document.querySelector(`.review-blank[data-word="${correct}"]`);
          if (blank) {
            blank.classList.remove('active');
            blank.classList.add('filled');
          }
        } else {
          // Normal level - fill in the blank
          const blank = document.getElementById('blank');
          if (blank) {
            blank.classList.add('filled');
          }
        }

        setChucho('correct');
        showStars();

        // Progress after delay
        setTimeout(() => {
          if (isReview) {
            const answeredCount = gameState.reviewBlanks.filter(rb => rb.answered).length;
            if (answeredCount >= 3) {
              // Review complete
              gameState.completedLevels.push(gameState.currentLevel);
              saveState();
              showCompleteScreen();
            } else {
              // Next review question
              renderReviewLevel();
              setChucho('waiting');
            }
          } else {
            gameState.completedLevels.push(gameState.currentLevel);
            gameState.currentLevel++;
            saveState();

            if (gameState.currentLevel > 10) {
              showCompleteScreen();
            } else {
              renderLevel();
            }
          }
        }, 1500);
      } else {
        // Wrong answer
        clickedBtn.classList.add('wrong');
        clickedBtn.disabled = true;
        setChucho('wrong');

        setTimeout(() => {
          setChucho('waiting');
        }, 1000);
      }
    }

    // Set Chucho state
    function setChucho(state) {
      gameChucho.className = 'chucho-svg ' + state;
    }

    // Show stars animation
    function showStars() {
      const colors = ['#FFD700', '#FFA500', '#FF6347', '#32CD32', '#4169E1'];

      for (let i = 0; i < 8; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.textContent = '⭐';
        star.style.left = (30 + Math.random() * 40) + '%';
        star.style.top = (30 + Math.random() * 20) + '%';
        star.style.animationDelay = (Math.random() * 0.3) + 's';
        starsContainer.appendChild(star);

        setTimeout(() => star.remove(), 1500);
      }
    }

    // Show confetti
    function showConfetti() {
      const colors = ['#FFD700', '#FF6347', '#32CD32', '#4169E1', '#FF69B4', '#00CED1'];

      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + '%';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDelay = (Math.random() * 2) + 's';
        confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        confettiContainer.appendChild(confetti);

        setTimeout(() => confetti.remove(), 5000);
      }
    }

    // Show complete screen
    function showCompleteScreen() {
      // Render complete rhyme
      completeRhyme.innerHTML = '';
      RHYME_LINES.forEach(line => {
        const lineDiv = document.createElement('div');
        lineDiv.className = 'rhyme-line';
        if (line.word) {
          lineDiv.innerHTML = colorizeText(line.text) + ' ' + colorizeWord(line.word) + colorizeText(line.suffix || '');
        } else {
          lineDiv.innerHTML = colorizeText(line.text);
        }
        completeRhyme.appendChild(lineDiv);
      });

      showScreen('complete');
    }

    // Start
    init();
    showScreen('title');
  </script>
</body>
</html>
